<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تحميل ChamiGo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: #171717;
      padding: 40px 25px;
      border-radius: 25px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 15px;
    }

    p {
      color: #bdbdbd;
      font-size: 17px;
      line-height: 1.8;
    }

    .download {
      display: block;
      margin-top: 30px;
      padding: 18px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 15px;
      font-size: 19px;
      font-weight: bold;
    }

    .download:active {
      transform: scale(0.97);
    }

    .note {
      margin-top: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>ChamiGo</h1>

    <p>
      حمّل تطبيق ChamiGo للأندرويد
      <br>
      آخر إصدار متوفر
    </p>

    <a class="download" href="./app-release.apk" download>
      تحميل ChamiGo APK
    </a>

    <div class="note">
      متوفر لأجهزة Android
    </div>

  </div>

</body>
</html>
