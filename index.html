<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تحميل ChamiGo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #080b12, #101a2c);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: auto;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(135deg, #4c8dff, #7357ff);
      box-shadow: 0 10px 30px rgba(76,141,255,0.35);
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #aeb8ca;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .download {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #287cff, #654cff);
      box-shadow: 0 10px 30px rgba(40,124,255,0.3);
    }

    .download:active {
      transform: scale(0.98);
    }

    .info {
      margin-top: 22px;
      color: #8e9aae;
      font-size: 14px;
    }

    .android {
      margin-top: 8px;
      font-size: 13px;
      color: #68758b;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">C</div>

    <h1>ChamiGo</h1>

    <div class="subtitle">
      حمّل تطبيق ChamiGo على هاتف Android
      <br>
      بسرعة وسهولة
    </div>

    <a class="download" href="app-release.apk" download>
      تحميل التطبيق APK
    </a>

    <div class="info">
      أحدث إصدار من ChamiGo
    </div>

    <div class="android">
      متوفر لأجهزة Android
    </div>

  </div>

</body>
</html>
